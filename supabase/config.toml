
[functions.wise-sync]
enabled = true
verify_jwt = true
import_map = "./functions/wise-sync/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/wise-sync/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/wise-sync/*.html" ]

# Las cuatro funciones con código en el repo. Hay dos más desplegadas
# (update-tasas y tg-send) cuyo código vive solo en la nube — si se editan,
# descargarlas antes: supabase functions download <nombre>

[functions.revolut-sync]
enabled = true
verify_jwt = true
entrypoint = "./functions/revolut-sync/index.ts"

# cierre-diario y backup-diario los dispara un cron, no el navegador.
# OJO al redesplegar: comprobar antes cómo se autentica el cron, porque
# verify_jwt = true rechazaría llamadas sin JWT.
[functions.cierre-diario]
enabled = true
entrypoint = "./functions/cierre-diario/index.ts"

[functions.backup-diario]
enabled = true
entrypoint = "./functions/backup-diario/index.ts"

[functions.abanca-sync]
enabled = true
verify_jwt = true
entrypoint = "./functions/abanca-sync/index.ts"

# El callback lo abre el navegador redirigido desde Abanca (sin cabeceras
# de Supabase): va SIN verificación de JWT.
[functions.abanca-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/abanca-callback/index.ts"
