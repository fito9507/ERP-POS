<style>
  :root {
    --steel: #1a1f2e;
    --steel-mid: #242938;
    --steel-light: #2e3548;
    --accent: #e8b84b;
    --accent2: #4b8fe8;
    --text: #f0f2f8;
    --text-dim: #8892a4;
    --border: rgba(255,255,255,0.07);
    --radius: 12px;
    --wa-green: #25D366;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--steel);
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
  }

  /* ── HEADER ── */
  header{
    background:var(--steel-mid);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
    backdrop-filter:blur(12px);
  }
  .header-inner{
    max-width:1200px;margin:0 auto;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:nowrap;
  }
  .logo{
    display:flex;align-items:center;gap:12px;
  }
  .logo-icon{
    width:80px;height:80px;
    background:#000;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  .logo-text{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;letter-spacing:1px;
    line-height:1;
  }
  .logo-sub{font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:.5px}

  /* ── CONTROLS ── */
  .controls{
    max-width:1200px;margin:0 auto;
    padding:20px 20px 0;
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;
  }
  .ctrl-group{display:flex;flex-direction:column;gap:5px}
  .ctrl-label{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}
  select, .search-inp{
    background:var(--steel-mid);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:9px 14px;
    font-size:13px;
    font-family:'DM Sans',sans-serif;
    outline:none;
    cursor:pointer;
    transition:border-color .2s;
    min-width:140px;
  }
  select:focus, .search-inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,184,75,.12)}
  .search-inp{min-width:200px}
  .search-inp::placeholder{color:var(--text-dim)}

  /* ── MODO & ALMACEN SELECTORS ── */
  .modo-btns, .alm-btns{display:flex;gap:8px;flex-wrap:wrap}
  .modo-btn, .alm-btn{
    padding:8px 16px;border-radius:8px;
    border:1px solid var(--border);
    background:transparent;color:var(--text-dim);
    font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;
    cursor:pointer;transition:all .2s;
  }
  .modo-btn.active{
    background:var(--accent2);color:#fff;
    border-color:var(--accent2);font-weight:600;
  }
  .modo-btn:not(.active):hover{border-color:var(--accent2);color:var(--accent2)}
  .alm-btn.active{
    background:var(--accent);color:#1a1f2e;
    border-color:var(--accent);font-weight:600;
  }
  .alm-btn:not(.active):hover{border-color:var(--accent);color:var(--accent)}

  /* ── MON PILLS ── */
  .mon-pills{display:flex;gap:6px;flex-wrap:wrap}
  .mon-pill{
    padding:6px 14px;border-radius:20px;
    border:1px solid var(--border);
    background:transparent;color:var(--text-dim);
    font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;
    cursor:pointer;transition:all .18s;
  }
  .mon-pill.active{
    background:var(--accent2);color:#fff;
    border-color:var(--accent2);
  }
  .mon-pill:not(.active):hover{border-color:var(--accent2);color:var(--accent2)}

  /* ── GRID ── */
  .grid-wrap{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
  .prod-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }

  /* ── CARD ── */
  .card{
    background:var(--steel-mid);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .2s, box-shadow .2s;
    position:relative;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.35)}

  .card-img{
    width:100%;aspect-ratio:4/3;
    object-fit:cover;
    background:var(--steel-light);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;color:var(--text-dim);
    position:relative;overflow:visible;
  }
  .card-img img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;z-index:1;background:var(--steel-light)}
  .badge-oferta-cat{position:absolute;top:8px;left:8px;z-index:10;display:inline-block;font-size:10px;font-weight:800;padding:3px 10px;border-radius:6px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.5)}
  .badge-reservado-cat{position:absolute;top:8px;left:8px;z-index:10;display:inline-block;font-size:10px;font-weight:800;padding:3px 10px;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.5)}
  .card-img .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:0}
  .card-img .placeholder span{font-size:11px;color:var(--text-dim);font-weight:500}

  .card-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
  .card-name{font-size:14px;font-weight:600;line-height:1.3}
  .card-cat{font-size:10px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .card-stock{font-size:11px;color:var(--text-dim)}
  .stock-ok{color:#4be8a0}
  .stock-low{color:var(--accent)}

  .prices{
    background:var(--steel-light);
    border-radius:8px;padding:10px 12px;
    display:flex;flex-direction:column;gap:4px;
    margin-top:4px;
  }
  .price-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;
  }
  .price-row .lbl{color:var(--text-dim);flex:1;margin-right:8px;line-height:1.15}
  .price-row .val{font-weight:600;font-size:13px;white-space:nowrap;text-align:right}
  .price-row.main .val{font-size:16px;color:var(--accent)}
  .price-tipo-btn{flex:1;padding:8px 6px;border-radius:8px;border:2px solid rgba(59,130,246,0.25);background:rgba(59,130,246,0.05);color:var(--text-secondary);font-size:11px;font-weight:700;cursor:pointer;text-align:center;line-height:1.4;transition:all .2s;}
  .price-tipo-btn.active-cif{border-color:#3b82f6;background:rgba(59,130,246,0.15);color:#3b82f6;}
  .price-tipo-btn.active-ddp{border-color:#10b981;background:rgba(16,185,129,0.15);color:#10b981;}

  /* qty control */
  .qty-row{
  .qty-row{
    display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:nowrap;
  }
  }
  .qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-shrink:0}
  .qty-btn{
    flex:1;height:48px;background:transparent;
    border:none;color:var(--text);font-size:24px;
    cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
  }
  .qty-btn:active{background:var(--steel-light)}
  .qty-inp{
    flex:1;text-align:center;background:transparent;
    border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);
    color:var(--text);font-size:16px;font-weight:700;font-family:'DM Sans',sans-serif;
    padding:0;height:48px;
    -webkit-appearance:none;-moz-appearance:textfield;appearance:textfield;
  }
  .qty-inp::-webkit-inner-spin-button,.qty-inp::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .qty-inp:focus{outline:none}
  .qty-disp{
    flex:1;text-align:center;
    border-left:1px solid var(--border);border-right:1px solid var(--border);
    color:var(--text);font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;height:48px;
    user-select:none;-webkit-user-select:none;
    cursor:text;
  }
  .add-btn{
    width:100%;padding:0 16px;height:48px;
    background:var(--accent);color:#1a1f2e;
    border:none;border-radius:10px;
    font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;
    cursor:pointer;transition:all .15s;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .add-btn:active{transform:scale(0.98)}
  .add-btn.added{background:#4be8a0;color:#1a1f2e}

  /* ── CART FLOAT ── */
  #cart-float{
    position:fixed;bottom:24px;right:24px;z-index:200;
    display:none;
  }
  .cart-btn{
    background:var(--wa-green);
    color:#fff;border:none;
    padding:14px 22px;border-radius:50px;
    font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;
    cursor:pointer;box-shadow:0 8px 24px rgba(37,211,102,.4);
    display:flex;align-items:center;gap:10px;
    transition:all .2s;
  }
  .cart-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(37,211,102,.5)}
  .cart-count{
    background:rgba(0,0,0,.25);
    border-radius:50%;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;
  }

  /* ── MODAL CART ── */
  #cart-modal{
    display:none;position:fixed;inset:0;z-index:300;
    background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    align-items:flex-end;justify-content:center;
  }
  #cart-modal.open{display:flex}
  .modal-box{
    background:var(--steel-mid);
    border-radius:20px 20px 0 0;
    width:100%;max-width:540px;
    max-height:85vh;overflow-y:auto;
    padding:24px 20px 32px;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;letter-spacing:1px;
    margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-close{
    background:var(--steel-light);border:none;color:var(--text);
    width:32px;height:32px;border-radius:50%;cursor:pointer;
    font-size:16px;display:flex;align-items:center;justify-content:center;
  }
  .cart-item{
    display:flex;flex-direction:column;
    padding:12px 0;border-bottom:1px solid var(--border);
    gap:0;
  }
  .cart-item-name{font-size:13px;font-weight:500;flex:1}
  .cart-item-qty{font-size:12px;color:var(--text-dim)}
  .cart-item-price{font-size:13px;font-weight:700;color:var(--accent)}
  .cart-item-rm{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 4px}
  .cart-item-rm:hover{color:#e84b4b}
  .cart-total{
    display:flex;justify-content:space-between;
    padding:14px 0 4px;font-weight:700;font-size:16px;
  }
  .cart-total span:last-child{color:var(--accent)}
  .cart-note{
    width:100%;background:var(--steel-light);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:10px 12px;
    font-size:13px;font-family:'DM Sans',sans-serif;
    resize:vertical;min-height:60px;margin:12px 0;outline:none;
  }
  .cart-note:focus{border-color:var(--accent)}
  .wa-send-btn{
    width:100%;padding:14px;
    background:var(--wa-green);color:#fff;
    border:none;border-radius:10px;
    font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:all .15s;margin-top:4px;
  }
  .wa-send-btn:hover{background:#1fb855;transform:scale(1.01)}
  .wa-icon{font-size:20px}

  /* ── EMPTY ── */
  .empty{text-align:center;padding:60px 20px;color:var(--text-dim)}
  .empty-icon{font-size:48px;margin-bottom:12px}
  .empty p{font-size:14px}

  /* ── LOADING ── */
  .loading{text-align:center;padding:60px 20px;color:var(--text-dim)}
  .spinner{
    width:36px;height:36px;border:3px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 16px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── FOOTER ── */
  footer{
    border-top:1px solid var(--border);
    text-align:center;padding:20px;
    font-size:12px;color:var(--text-dim);
  }

  @media(max-width:768px){
    .prod-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  }
  @media(max-width:600px){
    .header-inner{padding:12px 16px;gap:10px;}
    .logo-text{font-size:18px;}
    .logo-sub{font-size:10px;}
    .logo{gap:8px;}
    .controls{padding:16px 16px 0;gap:8px;flex-direction:column;align-items:stretch}
    .ctrl-group{width:100%}
    .ctrl-group .alm-btns{display:flex;gap:6px}
    .ctrl-group .alm-btn{flex:1;text-align:center;padding:8px 4px;font-size:12px}
    .ctrl-group .mon-pills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;flex-wrap:nowrap;scrollbar-width:none}
    .ctrl-group .mon-pills::-webkit-scrollbar{display:none}
    .ctrl-group .mon-pill{flex-shrink:0;padding:6px 14px;font-size:12px}
    select,.search-inp{min-width:unset;width:100%}
    .grid-wrap{padding:16px 12px 100px}
    .prod-grid{grid-template-columns:1fr 1fr;gap:10px}
    .card-body{padding:10px 12px;gap:6px}
    .card-name{font-size:13px}
    .card-img{aspect-ratio:1/1}
    .prices{padding:8px 10px}
    .price-row .val{font-size:12px}
    .price-row .lbl{font-size:10px}
    #cart-float{bottom:16px;right:16px}
    .modal-box{padding:20px 16px 28px;border-radius:20px 20px 0 0}
    .qty-row{flex-direction:column;align-items:stretch}
    .qty-ctrl{justify-content:center;width:100%}
    .add-btn{width:100%;text-align:center}
    .cart-total{font-size:15px}
  }
  @media(max-width:280px){
    .prod-grid{grid-template-columns:1fr}
  }
  /* ── MULTI-CURRENCY BADGES ── */
  .tot-currencies{
    display:flex;flex-wrap:wrap;gap:6px;
    padding:4px 0 12px;
  }
  .tot-pill{
    padding:4px 12px;border-radius:20px;
    font-size:12px;font-weight:600;
    background:var(--steel-light);color:var(--text-dim);
    border:1px solid var(--border);
    transition:all .15s;
  }
  .tot-pill.sel{
    background:var(--accent2);color:#fff;
    border-color:var(--accent2);
  }
</style>
</head>
<body>

<header>

// Exchange rates (loaded from Supabase tasas table)
let RATES = { USD:1, EUR:1.12, CUP:370, CUPT:270, DTO_PREVENTA:0 };

let RATES_ALM = { Habana:{USD:0,EUR:0,MLC:0,CUPT:10}, Placetas:{USD:0,EUR:0,MLC:0,CUPT:10} };
// CUPT_PCT = % extra sobre precio CUP para transferencia
let PRODS = [];
let ALM = 'Habana';
let MON = 'USD';
let CART_MON = 'USD'; // moneda independiente solo para el carrito
let CART = {}; // {prodName: {prod, qty}}
const CART_KEY = 'marinmetal_cart_v1';
const CART_TTL = 24 * 60 * 60 * 1000; // 24h en ms

function saveCartState(){
  try{
    var items = Object.values(CART).map(function(i){ return {name:i.prod.n, qty:i.qty}; });
    localStorage.setItem(CART_KEY, JSON.stringify({items:items, cartMon:CART_MON, alm:ALM, ts:Date.now()}));
  }catch(e){}
}
function loadCartState(){
  try{
    var raw = localStorage.getItem(CART_KEY);
    if(!raw) return;
    var data = JSON.parse(raw);
    if(!data || Date.now() - data.ts > CART_TTL){ localStorage.removeItem(CART_KEY); return; }
    // Restore almacen
    if(data.alm && (data.alm==='Habana'||data.alm==='Placetas'||data.alm==='Importacion')){
      ALM = data.alm;
      document.querySelectorAll('.alm-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.alm===ALM);
      });
    }
    // Restore cart currency
    if(data.cartMon && MON_SYM[data.cartMon]) CART_MON = data.cartMon;
    // Restore cart items
    (data.items||[]).forEach(function(saved){
      var p = PRODS.find(function(x){ return x.n===saved.name; });
      if(p) CART[p.n] = {prod:p, qty:saved.qty||1};
    });
    if(Object.keys(CART).length) updCart();
  }catch(e){}

const MON_SYM = { USD:'$', EUR:'€', CUP:'₱', CUPT:'₱' };
const MON_DEC = { USD:2, EUR:2, CUP:0, CUPT:0 };

// ── UTILS ─────────────────────────────────────────────────
function fN(n, dec){ 
  if(isNaN(n)||n==null) return '—';
  var d = dec ?? 2;
  var v=parseFloat(n);var maxD=d;if(d>0&&d<4){var rounded=Math.round(v*10000)/10000;var str=rounded.toString();if(str.includes('.')){var decs=str.split('.')[1].length;if(decs>d&&decs<=4)maxD=decs;}}return v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:maxD});
}
function fromUSD(usd, mon, alm){
  if(mon==='USD') return usd;
  var _alm = alm || ALM;
  // USD adj = extra CUP per USD for this almacen
  var adjUSD = (_alm&&RATES_ALM[_alm]&&RATES_ALM[_alm]['USD']) ? RATES_ALM[_alm]['USD'] : 0;
  // EUR adj = extra CUP per EUR for this almacen
  var adjEUR = (_alm&&RATES_ALM[_alm]&&RATES_ALM[_alm]['EUR']) ? RATES_ALM[_alm]['EUR'] : 0;
  // MLC adj = extra CUP per CUPT for this almacen
  var adjMLC = (_alm&&RATES_ALM[_alm]&&RATES_ALM[_alm]['MLC']) ? RATES_ALM[_alm]['MLC'] : 0;

  if(mon==='CUP'){
    // CUP = USD × (tasa_CUP/USD + ajuste_almacen)
    return parseFloat((usd*(RATES.CUP+adjUSD)).toFixed(0));
  }
  if(mon==='CUPT'){
    // CUPT = precio CUP × (1 + ajuste_CUPT%)
    // tasas_almacen moneda='CUPT' ajuste = % extra sobre CUP
    var cupt_pct = (_alm&&RATES_ALM[_alm]&&RATES_ALM[_alm]['CUPT']!=null) ? RATES_ALM[_alm]['CUPT'] : 10;
    var cupBase = usd*(RATES.CUP+adjUSD);
    return parseFloat((cupBase*(1+cupt_pct/100)).toFixed(0));
  }
  if(mon==='EUR'){
    var cupUSD = RATES.CUP + adjUSD;
    var cupEUR_base = RATES_EURUSD > 0.5 && RATES_EURUSD < 5
                    ? RATES.CUP * RATES_EURUSD
                    : RATES.CUP / 0.89;
    var cupEUR = cupEUR_base + adjEUR;
    return parseFloat((usd * cupUSD / cupEUR).toFixed(2));
  }
  return usd;
}
function fPrice(usd, mon, alm){
  var v = fromUSD(usd, mon, alm||ALM);
  return MON_SYM[mon] + ' ' + fN(v, MON_DEC[mon]);
}
function fSaving(usd, mon, alm){
  // Use 4 decimals max for USD/EUR savings so small amounts are visible, minimum 2
  var v = fromUSD(usd, mon, alm||ALM);
  if (mon === 'CUP' || mon === 'CUPT') return MON_SYM[mon] + ' ' + fN(v, 0);
  return MON_SYM[mon] + ' ' + v.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 4});
}

async function supa(path){

  return r.json();
}

var LOTE_RULE = (typeof localStorage !== 'undefined' && localStorage.getItem('erp_lote_rule')) || 'precio_desc_fifo';

function getLoteActivo(prod, almacen) {
  var lotes = (prod.lotes || []).filter(function(l) {
    return l.almacen === almacen && (l.cantidad || 0) > 0;
  });
  if (!lotes.length) return null;
  
  lotes.sort(function(a, b) {
    if (LOTE_RULE === 'precio_desc_fifo') {
      if ((b.precio_venta||0) !== (a.precio_venta||0)) 
        return (b.precio_venta||0) - (a.precio_venta||0);
      return new Date(a.fecha_entrada||0) - new Date(b.fecha_entrada||0);
    }
    if (LOTE_RULE === 'fifo') {
      return new Date(a.fecha_entrada||0) - new Date(b.fecha_entrada||0);
    }
    if (LOTE_RULE === 'lifo') {
      return new Date(b.fecha_entrada||0) - new Date(a.fecha_entrada||0);
    }
    return 0;
  });
  
  return lotes[0];
}

let MODO = 'stock'; // 'stock' | 'transit' | 'import'
let FOLIOS = [];

async function loadFoliosRes(){
  try {
    var fRows = await supa('folios?select=almacen,tipo_reserva,lineas,estado');
    if (Array.isArray(fRows)) FOLIOS = fRows;
  } catch(e){ FOLIOS = []; }
}

function getCommittedFoliosQty(prodName, alm, isTransit) {
  var total = 0;
  (FOLIOS || []).forEach(function(f){
    if (f.estado === 'pagado' || f.estado === 'Pagado') return;
    var fAlm = f.almacen || f.alm;
    if (fAlm && fAlm !== alm) return;
    var fIsTransit = (f.tipo_reserva === 'prereserva');
    if (isTransit !== fIsTransit) return;
    var lns = f.lineas;
    if (typeof lns === 'string') {
      try { lns = JSON.parse(lns); } catch(e){ lns = []; }
    }
    if (Array.isArray(lns)) {
      lns.forEach(function(l){
        var lName = l.prod || l.producto || l.n;
        if (lName === prodName) {
          total += (l.q || l.cantidad || 0);
        }
      });
    }
  });
  return total;
}

function getAvailableStock(p, alm, modo) {
  var _alm = alm || ALM || 'Habana';
  var _modo = modo || MODO || 'stock';
  if (p.por_encargo || _modo === 'import') return 999999;
  var isTransit = (_modo === 'transit');
  var committed = getCommittedFoliosQty(p.n, _alm, isTransit);
  
  if (isTransit) {
    var trVal = (p.enTransito && p.enTransito[_alm]);
    if (!trVal) return 0;
    if (typeof trVal === 'number' && trVal > 0) {
      return Math.max(0, trVal - committed);
    }
    return committed > 0 ? Math.max(0, 999 - committed) : 999;
  }
  
  var base = (p.stk_alm && p.stk_alm[_alm] != null) ? p.stk_alm[_alm] : (p.stk || 0);
  return Math.max(0, base - committed);
}

window._tPago = function(id, tipo, pidx, basePrice) {
  var bExt = document.getElementById('pb-ext-'+id);
  var bCub = document.getElementById('pb-cub-'+id);
  var calcContainer = document.getElementById('calc-esq-'+id);
  if(!bExt || !bCub) return;
  var actBg = '#3b82f6', actCol = '#fff', actBord = '#3b82f6';
  var inBg = 'transparent', inCol = 'var(--text-secondary)', inBord = 'var(--text-tertiary)';
  
  if(tipo === 'ext') {
    bExt.style.background = actBg; bExt.style.color = actCol; bExt.style.borderColor = actBord;
    bCub.style.background = inBg; bCub.style.color = inCol; bCub.style.borderColor = inBord;
  } else {
    bCub.style.background = actBg; bCub.style.color = actCol; bCub.style.borderColor = actBord;
    bExt.style.background = inBg; bExt.style.color = inCol; bExt.style.borderColor = inBord;
  }

  // Get full product to recalculate everything
  var p = (typeof PRODS !== 'undefined' && pidx != null) ? PRODS[pidx] : null;
  if (!p) return;

  var recargo_cuba = p.recargo_cuba || '';
  console.log("=== DEBUG _tPago ===");
  console.log("Producto:", p.n);
  console.log("Recargo almacenado (p.recargo_cuba):", p.recargo_cuba);
  console.log("Valor base CIF:", p.precio_cif, " DDP:", p.precio_ddp);
  var esquemaStr = p.esquema_pago || '';
  
  var sp = document.getElementById('qd-tr-'+id) || document.getElementById('qd-'+id);
  var qty = sp ? Math.max(p.moq||1, parseInt(sp.textContent)||p.moq||1) : (p.moq||1);
  
  var applyRecargo = function(val) {
    if (val == null) return val;
    if (tipo === 'ext' || !recargo_cuba) return val;
    if (String(recargo_cuba).includes('%')) {
      var pct = parseFloat(recargo_cuba) / 100;
      return isNaN(pct) ? val : val * (1 + pct);
    } else {
      var num = parseFloat(recargo_cuba);
      return isNaN(num) ? val : val + num;
    }
  };

  var newBase = applyRecargo(basePrice);
  var newCif = p ? applyRecargo(p.precio_cif) : null;
  var newDdp = p ? applyRecargo(p.precio_ddp) : null;
  console.log("Valores Recalculados -> CIF:", newCif, "DDP:", newDdp, "Base:", newBase);
  
  var activePrice = newBase;
  var btnCif = document.getElementById('ptbtn-cif-'+id);
  var btnDdp = document.getElementById('ptbtn-ddp-'+id);
  if (btnDdp && btnDdp.className.indexOf('active-ddp') !== -1) {
    activePrice = newDdp;
  } else if (btnCif && btnCif.className.indexOf('active-cif') !== -1) {
    activePrice = newCif;
  } else if (newDdp != null) {
    activePrice = newDdp; // Default logic in catalogo is DDP first
  } else if (newCif != null) {
    activePrice = newCif;
  }

  var _mon = (typeof MON!=='undefined') ? MON : 'USD';
  var _alm = (typeof ALM!=='undefined') ? ALM : 'Placetas';

  var elCif = document.getElementById('cif-val-'+id);
  if (elCif && newCif != null) elCif.innerHTML = fPrice(newCif, _mon, _alm);
  
  var elDdp = document.getElementById('ddp-val-'+id);
  if (elDdp && newDdp != null) elDdp.innerHTML = fPrice(newDdp, _mon, _alm);

  if (p && p.precio_mercado) {
    var gananciaBaseP = newDdp != null ? newDdp : (newCif != null ? newCif : newBase);
    var ahorro = (p.precio_mercado > gananciaBaseP) ? (p.precio_mercado - gananciaBaseP) : null;
    var ganancia = (ahorro != null) ? ahorro * qty : null;

    var elAhorroTot = document.getElementById('ahorro-tot-'+id);
    if (elAhorroTot && ganancia != null) elAhorroTot.innerHTML = fPrice(ganancia, _mon, _alm);
    
    var elMargenDet = document.getElementById('margen-det-'+id);
    if (elMargenDet && ahorro != null) {
      elMargenDet.innerHTML = fPrice(ahorro, _mon, _alm) + ' margen/ud &middot; DDP &middot; Mariel: ' + fPrice(gananciaBaseP, _mon, _alm);
    }

    var elAhorroPill = document.getElementById('ahorro-pill-'+id);
    if (elAhorroPill && ahorro != null) {
      elAhorroPill.innerHTML = '-'+fPrice(ahorro, _mon, _alm)+'/ud';
    }
  }

  var elSinglePrice = document.getElementById('single-price-'+id);
  if (elSinglePrice) elSinglePrice.innerHTML = fPrice(activePrice, _mon, _alm);

  var loteActivo = (typeof getLoteActivo === 'function') ? getLoteActivo(p, _alm) : null;
  var lotePrecio = (loteActivo && loteActivo.precio_venta > 0) ? loteActivo.precio_venta : 0;
  var priceMinCalc = lotePrecio > 0 ? lotePrecio : ((_alm==='Placetas'&&p.min_placetas!=null)?p.min_placetas:(p.min||0));
  var priceMajCalc = lotePrecio > 0 ? lotePrecio : ((_alm==='Placetas'&&p.maj_placetas!=null)?p.maj_placetas:((p.maj||p.min)||0));

  var elMin = document.getElementById('min-val-'+id);
  if (elMin) elMin.innerHTML = fPrice(applyRecargo(priceMinCalc), _mon, _alm);
  var elMaj = document.getElementById('maj-val-'+id);
  if (elMaj) elMaj.innerHTML = fPrice(applyRecargo(priceMajCalc), _mon, _alm);
  var elMain = document.getElementById('main-val-'+id);
  if (elMain) elMain.innerHTML = fPrice(applyRecargo(priceMinCalc||priceMajCalc), _mon, _alm);

  if (calcContainer && typeof renderEsquemaCalculado === 'function') {
    calcContainer.innerHTML = renderEsquemaCalculado(esquemaStr, activePrice, qty);
  }
};

function selectPriceTipo(cardId, pidx, tipo) {
  var p = PRODS[pidx]; if(!p) return;
  var cifP = p.precio_cif; var ddpP = p.precio_ddp;
  var baseP = p.min || p.maj || 0;
  var price = tipo==='cif'?(cifP!=null?cifP:baseP):(tipo==='ddp'?(ddpP!=null?ddpP:baseP):baseP);
  
  var bCub = document.getElementById('pb-cub-'+cardId);
  var isCub = bCub && (bCub.style.background === 'rgb(59, 130, 246)' || bCub.style.background === '#3b82f6' || bCub.style.backgroundColor === 'rgb(59, 130, 246)');
  if (isCub && p.recargo_cuba) {
    if (String(p.recargo_cuba).includes('%')) {
      var pct = parseFloat(p.recargo_cuba) / 100;
      if (!isNaN(pct)) price = price * (1 + pct);
    } else {
      var val = parseFloat(p.recargo_cuba);
      if (!isNaN(val)) price = price + val;
    }
  }

  var sp = document.getElementById('qd-'+cardId);
  var qty = sp ? Math.max(p.moq||1, parseInt(sp.textContent)||p.moq||1) : (p.moq||1);
  // Toggle button states
  var btnCif = document.getElementById('ptbtn-cif-'+cardId);
  var btnDdp = document.getElementById('ptbtn-ddp-'+cardId);
  if(btnCif){ btnCif.className='price-tipo-btn'+(tipo==='cif'?' active-cif':''); }
  if(btnDdp){ btnDdp.className='price-tipo-btn'+(tipo==='ddp'?' active-ddp':''); }
  // Re-render payment scheme
  var esqEl = document.getElementById('calc-esq-'+cardId);
  if(esqEl) esqEl.innerHTML = renderEsquemaCalculado(p.esquema_pago, price, qty);
  // Ganancia is DDP-fixed, does not change on price toggle
}
function renderEsquemaCalculado(esquemaStr, price, qty) {
  if (!esquemaStr) return '<div style="color:var(--text-dim)">Pago escalado / A convenir</div>';
  var parts = esquemaStr.split(/[|\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (parts.length === 0) return '<div style="color:var(--text-dim)">Pago escalado / A convenir</div>';
  
  var total = price * qty;
  var html = '<div style="display:flex;flex-direction:column;gap:4px">';
  parts.forEach(function(part) {
    var match = part.match(/^(\d+(?:\.\d+)?)%\s*(.*)$/);
    if (match) {
      var pct = parseFloat(match[1]);
      var amount = total * (pct / 100);
      var desc = match[2];
      html += '<div style="display:flex;flex-direction:column;background:rgba(59,130,246,0.02);padding:4px 8px;border-radius:4px;border:1px solid rgba(59,130,246,0.15)">'
           + '<div style="font-weight:800;color:#3b82f6;font-size:11px;display:flex;justify-content:space-between">'
           + '<span>'+pct+'%</span> <span style="color:var(--text-main)">'+fPrice(amount, MON, ALM)+'</span>'
           + '</div>'
           + '<div style="font-size:10px;color:var(--text-tertiary);line-height:1.2;margin-top:2px">'+esc(desc)+'</div>'
           + '</div>';
    } else {
      html += '<div style="font-size:11px;color:var(--text-secondary)">' + esc(part) + '</div>';
    }
  });
  html += '</div>';
  return html;
}

function esc(s){ return (s||'').replace(/['"<>&]/g,function(c){return {'\'':'&#39;','"':'&quot;','<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }

function _zoomImg(src) {

}

var _lpTimer=null, _lpInterval=null;
// Qty display tap-to-edit helpers
function _qdSelectAll(el){
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function _qdKeydown(e, el, idx){
  if(e.key==='Enter'){ e.preventDefault(); el.blur(); return; }
  // Only allow digits and control keys
  if(e.key.length===1 && !/[0-9]/.test(e.key)) e.preventDefault();
}
function _qdBlur(el, idx){
  var v = parseInt(el.textContent)||1;
  var p = PRODS[idx]; if(!p) return;
  var isT = p.enTransito && p.enTransito[ALM];
  var moq = isT ? (p.moq||1) : 1;
  v = Math.max(moq, v);
  // Cap at available stock incorporating prereservas/folios
  var maxStk = getAvailableStock(p, ALM, MODO);
  if(!p.por_encargo && maxStk >= 0) v = Math.min(v, maxStk);
  el.textContent = v;
  var cardId = p.id ? String(p.id) : p.n.replace(/[^a-zA-Z0-9]/g,'_');
  updCardPrices(cardId, p, v);
}
function chgQtyIdx(idx, d){
  var p = PRODS[idx]; if(!p) return;
  var cardId = p.id ? String(p.id) : p.n.replace(/[^a-zA-Z0-9]/g,'_');
  var sp = document.getElementById('qd-'+cardId) || document.getElementById('qd-tr-'+cardId);
  if(!sp) return;
  var isT = p.enTransito && p.enTransito[ALM];
  var moq = (isT || p.por_encargo) ? (p.moq||1) : 1;
  var v = parseInt(sp.textContent)||moq;
  v = d > 0 ? v + 1 : Math.max(moq, v - 1);
  // Cap at available stock incorporating prereservas/folios
  if(d > 0 && !p.por_encargo){
    var maxStk = getAvailableStock(p, ALM, MODO);
    if(maxStk >= 0) v = Math.min(v, maxStk);
  }
  sp.textContent = v;
  updCardPrices(cardId, p, v);
}
function _lpStart(idx, d){
  chgQtyIdx(idx, d);
  _lpTimer = setTimeout(function(){
    _lpInterval = setInterval(function(){ chgQtyIdx(idx, d); }, 80);
  }, 400);
}
function _lpStop(){
  if(_lpTimer)  { clearTimeout(_lpTimer);   _lpTimer=null;   }
  if(_lpInterval){ clearInterval(_lpInterval); _lpInterval=null; }
}
function updCardPrices(cardId, p, qty){
  var card = document.getElementById('card-'+cardId) || document.getElementById('card-tr-'+cardId);
  if(!card) return;
  // Find active escala price
  var activePrice = null;
  if(p.escala && p.escala.length){
    var sorted = p.escala.slice().sort(function(a,b){return b.desde-a.desde;});
    for(var i=0;i<sorted.length;i++){
      var r=sorted[i];
      if(qty>=r.desde&&(r.hasta==null||r.hasta===''||qty<=r.hasta)){
        activePrice=parseFloat(r.precio); break;
      }
    }
    // Highlight escala rows
    card.querySelectorAll('[data-escala-idx]').forEach(function(row){
      var desde=parseInt(row.dataset.desde)||0;
      var hasta=row.dataset.hasta===''?null:parseInt(row.dataset.hasta);
      var isActive=qty>=desde&&(hasta==null||qty<=hasta);
      var val=row.querySelector('.escala-val');
      if(val) val.style.color=isActive?'var(--accent)':'var(--text-dim)';
    });
  } else {
    // Min/maj: highlight based on qty
    var MIN_MAY_loc = typeof MIN_MAY!=='undefined'?MIN_MAY:10;
    var isMaj = qty >= MIN_MAY_loc;
    activePrice = isMaj ? (p.maj||p.min||0) : (p.min||p.maj||0);
    card.querySelectorAll('[data-minmaj]').forEach(function(row){
      var tipo = row.dataset.minmaj;
      var isActive = (tipo==='maj' && isMaj) || (tipo==='min' && !isMaj);
      var val = row.querySelector('.minmaj-val');
      if(val) val.style.color = isActive ? 'var(--accent)' : 'var(--text-dim)';
    });
  }
  if(activePrice==null) return;
  var _ofeP=p.oferta?(ALM==='Placetas'?(p.precioOfertaPlacetas||p.precioOfertaHabana||null):(p.precioOfertaHabana||null)):null;
  var _equivRef=(_ofeP&&_ofeP>0)?_ofeP:activePrice;
  var ahorroTot = document.getElementById('ahorro-tot-'+cardId);
  if (ahorroTot && p.precio_mercado && p.precio_mercado > _equivRef) {
    var _gbP = p.precio_ddp!=null?p.precio_ddp:(p.precio_cif!=null?p.precio_cif:_equivRef);
    var _ganancia = p.precio_mercado > _gbP ? (p.precio_mercado - _gbP) * qty : 0;
    var _margen   = p.precio_mercado > _gbP ? (p.precio_mercado - _gbP) : 0;
    ahorroTot.textContent = fPrice(_ganancia, MON, ALM);
    var _subEl = ahorroTot.nextElementSibling;
    if(_subEl) _subEl.textContent = fPrice(_margen,MON,ALM)+' margen/ud · DDP · Mariel: '+fPrice(_gbP,MON,ALM);
  }
  card.querySelectorAll('[data-equiv]').forEach(function(row){
    var mon=row.dataset.equiv;
    var el=row.querySelector('.equiv-val');
    if(el) el.textContent=fPrice(_equivRef,mon,ALM);
  });
  
  var calcEsq = document.getElementById('calc-esq-'+cardId);
  if (calcEsq && p.por_encargo) {
    var _esqP = _equivRef;
    var _btnCif = document.getElementById('ptbtn-cif-'+cardId);
    var _btnDdp = document.getElementById('ptbtn-ddp-'+cardId);
    if(_btnCif&&_btnCif.classList.contains('active-cif')&&p.precio_cif!=null) _esqP=p.precio_cif;
    else if(_btnDdp&&_btnDdp.classList.contains('active-ddp')&&p.precio_ddp!=null) _esqP=p.precio_ddp;
    calcEsq.innerHTML = renderEsquemaCalculado(p.esquema_pago, _esqP, qty);
  }
  
  var ahorroTot = document.getElementById('ahorro-tot-'+cardId);
  if (ahorroTot && p.precio_mercado && p.precio_mercado > _equivRef) {
    ahorroTot.textContent = 'Ganancia Potencial: ' + fPrice((p.precio_mercado - _equivRef)*qty, MON, ALM);
  }
}
function addToCartIdx(idx){
  var p = PRODS[idx]; if(!p) return;
  var cardId = p.id ? String(p.id) : p.n.replace(/[^a-zA-Z0-9]/g,'_');
  var sp = document.getElementById('qd-'+cardId) || document.getElementById('qd-tr-'+cardId);
  var isT = p.enTransito && p.enTransito[ALM];
  var moq = (isT || p.por_encargo) ? (p.moq||1) : 1;
  var qty = sp ? Math.max(moq, parseInt(sp.textContent)||moq) : moq;
  
  // Enforce available stock limit considering committed folios/prereservas
  if(!p.por_encargo){
    var maxStk = getAvailableStock(p, ALM, MODO);
    if(qty > maxStk) {
      qty = Math.max(0, maxStk);
      if(sp) sp.textContent = qty;
      if(typeof showToast==='function') showToast("Stock disponible alcanzado: " + maxStk + " uds");
    }
    if(qty <= 0) {
      if(typeof showToast==='function') showToast("Sin stock disponible por reservas activas");
      return;
    }
  }
  var isCub = false;
  var tipoImport = 'base';
  if (p.por_encargo) {
    var bCub = document.getElementById('pb-cub-'+cardId);
    isCub = bCub && (bCub.style.background === 'rgb(59, 130, 246)' || bCub.style.background === '#3b82f6' || bCub.style.backgroundColor === 'rgb(59, 130, 246)');
    var btnCif = document.getElementById('ptbtn-cif-'+cardId);
    var btnDdp = document.getElementById('ptbtn-ddp-'+cardId);
    if (btnDdp && btnDdp.className.indexOf('active-ddp') !== -1) tipoImport = 'ddp';
    else if (btnCif && btnCif.className.indexOf('active-cif') !== -1) tipoImport = 'cif';
    else if (p.precio_ddp != null) tipoImport = 'ddp';
    else if (p.precio_cif != null) tipoImport = 'cif';
  }
  
  CART[p.n] = {prod:p, qty:qty, tipoImport:tipoImport, enCuba:!!isCub};
  var btn = document.getElementById('addbtn-'+cardId) || document.getElementById('addbtn-tr-'+cardId);
  if(btn){ btn.textContent = p.por_encargo ? '✓ Encargado' : ((p.enTransito&&p.enTransito[ALM]) ? '✓ Reservado' : '✓ Agregado'); btn.classList.add('added'); }
  updCart(); saveCartState();
}

function getEscalaPrice(p, qty){
  if(!p.escala || !p.escala.length) return null;
  var match = null;
  var sorted = p.escala.slice().sort(function(a,b){return b.desde-a.desde;});
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    if(qty >= r.desde && (r.hasta==null || r.hasta==='' || qty <= r.hasta)){
      match = r.precio; break;
    }
  }
  // Fallback: if no range matches but escala exists, use first range price
  if(match==null && p.escala.length) match = p.escala[0].precio;
  return match;
}

function getCartPrice(i){
  var p = i.prod;
  var isPlac = ALM === 'Placetas';
  var loteActivo = (typeof getLoteActivo === 'function') ? getLoteActivo(p, ALM) : null;
  var lotePrecio = (loteActivo && loteActivo.precio_venta > 0) ? loteActivo.precio_venta : 0;
  var min = lotePrecio > 0 ? lotePrecio : ((isPlac && p.min_placetas!=null) ? p.min_placetas : (p.min||0));
  var maj = lotePrecio > 0 ? lotePrecio : ((isPlac && p.maj_placetas!=null) ? p.maj_placetas : (p.maj||0));
  var MIN_MAY = p.min_may || 10;
  var isMay = i.qty >= MIN_MAY && maj > 0;
  var isTransit = p.enTransito && p.enTransito[ALM];
  
  if(isTransit) {
    var baseTPrice = isMay ? (maj||min||0) : (min||maj||0);
    var pvPrice = null;
    if (p.preventa_min != null) {
      pvPrice = p.preventa_min;
    } else if (RATES.DTO_PREVENTA > 0) {
      pvPrice = Number((baseTPrice * (1 - RATES.DTO_PREVENTA/100)).toFixed(4));
    }
    if (pvPrice != null) return {price:pvPrice, isMay:false, MIN_MAY:MIN_MAY, isTransit:true};
  }
  
  var ofertaPrice = p.oferta ? (isPlac ? (p.precioOfertaPlacetas||p.precioOfertaHabana||null) : (p.precioOfertaHabana||null)) : null;
  if(ofertaPrice!=null && ofertaPrice>0) return {price:ofertaPrice, isMay:false, MIN_MAY:MIN_MAY, isTransit:false, isOferta:true};
  var escalaPrice = getEscalaPrice(p, i.qty);
  var basePrice = escalaPrice!=null ? escalaPrice : (isMay ? (maj||min||0) : (min||maj||0));
  // Fallback for por_encargo products: use precio_ddp > precio_cif > precio_mercado if base is 0
  if(p.por_encargo){
    if (i.tipoImport === 'ddp') basePrice = p.precio_ddp || 0;
    else if (i.tipoImport === 'cif') basePrice = p.precio_cif || 0;
    else if (basePrice === 0) {
      basePrice = (p.precio_ddp!=null && p.precio_ddp>0) ? p.precio_ddp
                : (p.precio_cif!=null && p.precio_cif>0) ? p.precio_cif
                : (p.precio_mercado!=null && p.precio_mercado>0) ? p.precio_mercado
                : 0;
    }

    if (i.enCuba && p.recargo_cuba) {
      if (String(p.recargo_cuba).includes('%')) {
        var pct = parseFloat(p.recargo_cuba) / 100;
        if (!isNaN(pct)) basePrice = basePrice * (1 + pct);
      } else {
        var num = parseFloat(p.recargo_cuba);
        if (!isNaN(num)) basePrice = Number(basePrice) + num;
      }
    }
  }
  return {price:basePrice, isMay:isMay, MIN_MAY:MIN_MAY, isTransit:false, hasEscala:escalaPrice!=null};
}
function updCartQty(name, val){
  if(!CART[name]) return;
  var p = CART[name].prod;
  var isTransit = p.enTransito && p.enTransito[ALM];
  var isEncargo = p.por_encargo === true;
  var minQty = (isTransit || isEncargo) ? (p.moq||1) : 1;
  var qty = Math.max(minQty, parseInt(val)||minQty);
  // Skip stock cap for import (por_encargo) products — they have no physical stock limit
  if(!isEncargo){
    var maxStk = (p.stk_alm && p.stk_alm[ALM] != null) ? p.stk_alm[ALM] : (p.stk||0);
    if(qty > maxStk) {
      qty = Math.max(0, maxStk);
      if(typeof showToast==='function') showToast("Stock máximo alcanzado: " + maxStk);
    }
  }
  CART[name].qty = qty;
  renderCart(); updCart(); saveCartState();
}
function renderCart(){
  var items = Object.values(CART);
  var el = document.getElementById('cart-items');
  var totEl = document.getElementById('cart-total-val');
  if(!items.length){ el.innerHTML='<div style="color:var(--text-dim);font-size:13px;padding:16px 0">Sin productos agregados</div>'; totEl.textContent='0,00'; return; }
  var total = 0;
  el.innerHTML = items.map(function(i){
    var r = getCartPrice(i);
    var lineTotal = r.price * i.qty;
    total += lineTotal;
    var isTransitProd = i.prod.enTransito && i.prod.enTransito[ALM];
    var tag = isTransitProd
      ? '<span style="font-size:9px;background:#f59e0b;color:#1a1f2e;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:700">Preventa</span>'
      : (i.prod.maj>0 ? (r.isMay
        ? '<span style="font-size:9px;background:var(--accent2);color:#fff;padding:1px 6px;border-radius:4px;margin-left:6px">Mayorista</span>'
        : '<span style="font-size:9px;color:var(--text-dim);padding:1px 4px;border-radius:4px;margin-left:6px">Min·'+r.MIN_MAY+'+→May</span>') : '');
    
    if (i.prod.por_encargo) {
      var encargoTagStr = "Importación";
      if (i.tipoImport === 'cif') encargoTagStr = "CIF";
      else if (i.tipoImport === 'ddp') encargoTagStr = "DDP";
      encargoTagStr += i.enCuba ? " (Cuba)" : " (Ext)";
      tag += '<span style="font-size:9px;background:#3b82f6;color:#fff;padding:1px 6px;border-radius:4px;margin-left:6px;font-weight:700">'+encargoTagStr+'</span>';
    }
    
    return '<div class="cart-item">'
      +'<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">'
      +'<div class="cart-item-name" style="flex:1">'+esc(i.prod.n)+tag+'</div>'
      +'<button class="cart-item-rm" onclick="removeFromCart(\''+esc(i.prod.n)+'\')">✕</button>'
      +'</div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">'
      +'<div style="display:flex;align-items:center;gap:6px">'
      +'<div class="qty-ctrl" style="border-radius:8px">'
      +'<button class="qty-btn" onclick="updCartQty(\''+esc(i.prod.n)+'\',' +Math.max((isTransitProd?(i.prod.moq||1):1),i.qty-1)+ ')" style="width:40px;height:40px;font-size:20px">\u2212</button>'
      +'<input class="qty-inp" type="number" min="1" value="'+i.qty+'" onchange="updCartQty(\''+esc(i.prod.n)+'\',this.value)" style="width:52px;height:40px;font-size:15px">'
      +'<button class="qty-btn" onclick="updCartQty(\''+esc(i.prod.n)+'\',' +(i.qty+1)+ ')" style="width:40px;height:40px;font-size:20px">+</button>'
      +'</div>'
      +'<span style="font-size:12px;color:var(--text-dim)">× '+fPrice(r.price,CART_MON,ALM)+'</span>'
      +'</div>'
      +'<span class="cart-item-price" style="font-size:16px">'+fPrice(lineTotal,CART_MON)+'</span>'
      +'</div>'
      +'</div>';
  }).join('');
  // Main total in selected currency
  totEl.textContent = fPrice(total, CART_MON);
  // Multi-currency badges (clickable — cambian la moneda activa)
  var altEl = document.getElementById('cart-tot-currencies');
  if(altEl){
    var mons = ['USD','EUR','CUP','CUPT'];
    altEl.innerHTML = mons.map(function(m){
      var v = fromUSD(total, m, ALM);
      var sym = MON_SYM[m];
      var dec = MON_DEC[m];
      var isSel = m === CART_MON;
      return '<span class="tot-pill'+(isSel?' sel':'')+'" style="cursor:pointer" onclick="setMonCart(\''+m+'\')">'+
        sym + ' ' + fN(v, dec) + ' ' + m +
        '</span>';
    }).join('');
  }
}

function setMonCart(m){
  CART_MON = m; // solo afecta al carrito, no a la tienda
  saveCartState();
  renderCart();
}

function sendWA(){
  var items = Object.values(CART);
  if(!items.length){ alert('Agrega productos al pedido primero'); return; }
  var hasEncargo = items.some(function(i){ return i.prod.por_encargo; });
  var lines = items.map(function(i){
    var r = getCartPrice(i);
    var ln = '• '+i.qty+'× '+i.prod.n+' @ '+fPrice(r.price, CART_MON)+' → '+fPrice(r.price*i.qty, CART_MON)+(r.isMay?' (May)':' (Min)');
    if (i.prod.por_encargo) {
      var totalItem = r.price * i.qty;
      var optionStr = i.tipoImport==='cif'?'CIF':(i.tipoImport==='ddp'?'DDP':'Importación');
      optionStr += i.enCuba ? " (Pagado en Cuba)" : " (Pagado en Exterior)";
      ln += '\n  ↳ 📦 Opción Seleccionada: ' + optionStr;
      
      if (i.prod.precio_cif != null) ln += '\n  ↳ ⚓ Precio Referencia CIF: ' + fPrice(i.prod.precio_cif, CART_MON) + '/ud';
      if (i.prod.precio_ddp != null) ln += '\n  ↳ 🚚 Precio Referencia DDP: ' + fPrice(i.prod.precio_ddp, CART_MON) + '/ud';
      var eParts = (i.prod.esquema_pago||'').split(/[|\n]/).map(function(s){ return s.trim(); }).filter(Boolean);
      var esqLines = [];
      eParts.forEach(function(part){
        var match = part.match(/^(\d+(?:\.\d+)?)%\s*(.*)$/);
        if(match) {
          esqLines.push(match[1]+'% ('+fPrice(totalItem*(parseFloat(match[1])/100), CART_MON)+') ' + match[2]);
        } else {
          esqLines.push(part);
        }
      });
      ln += '\n  ↳ 🚢 Importación - Esquema de Pago:\n      · ' + (esqLines.length ? esqLines.join('\n      · ') : 'Pago escalado / A convenir');
      if (i.prod.tiempo_transito) ln += '\n  ↳ ⏳ Tiempo estimado: ' + i.prod.tiempo_transito;
    }
    return ln;
  });
  var total = items.reduce(function(a,i){
    return a + getCartPrice(i).price * i.qty;
  },0);
  var nota   = (document.getElementById('cart-note')?.value||'').trim();
  var nombre = (document.getElementById('cart-nombre')?.value||'').trim();
  var tel    = (document.getElementById('cart-tel')?.value||'').trim();
  if(!nombre){ document.getElementById('cart-nombre').style.borderColor='#e84b4b'; document.getElementById('cart-nombre').focus(); return; }
  if(!tel){ document.getElementById('cart-tel').style.borderColor='#e84b4b'; document.getElementById('cart-tel').focus(); return; }
  var msg = '\uD83C\uDFF7\uFE0F *' + (hasEncargo ? 'Pedido de Importación' : 'Pedido') + ' \u2014 '+ALM+'*\n\n'
    + '\uD83D\uDC64 *'+nombre+'*'+(tel?' \u00b7 \uD83D\uDCDE '+tel:'')+'\n\n'
    + lines.join('\n') + '\n\n'
    + '\uD83D\uDCB0 *Total: '+fPrice(total,CART_MON)+'*\n'
    + '\uD83D\uDCCD Almac\u00e9n: *'+ALM+'*\n'
    + (nota?'\uD83D\uDCDD '+nota+'\n':'')
    + '\n_Solicito confirmaci\u00f3n de disponibilidad y precio final._';
  var phone = WA[ALM] || WA.Habana;
  // Notify Telegram group
  var tgMsg = '\uD83D\uDED2 <b>Pedido cat\u00e1logo — '+ALM+'</b>\n'
    + '\uD83D\uDC64 <b>'+nombre+'</b>'+(tel?' · \uD83D\uDCDE '+tel:'')+'\n\n'
    + items.map(function(i){var r=getCartPrice(i);return '• '+i.qty+'\u00d7 '+i.prod.n+' @ '+fPrice(r.price,CART_MON)+' \u2192 '+fPrice(r.price*i.qty,CART_MON);}).join('\n')
    + '\n\n\uD83D\uDCB0 <b>Total: '+fPrice(items.reduce(function(a,i){return a+getCartPrice(i).price*i.qty;},0),CART_MON)+'</b>'
    + (nota?'\n\uD83D\uDCDD '+nota:'');
  tgSend(tgMsg, ALM);
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg), '_blank');
}

function openFichaModal(pidx){
  var p = PRODS[pidx];
  if(!p || !p.ficha_tecnica) return;
  var html = esc(p.ficha_tecnica).split('\n').map(function(line){
    if(!line.trim()) return '';
    var idx = line.indexOf(':');
    if(idx !== -1) {
      return '<tr><td style="padding:8px 0;font-weight:700;color:var(--text-main);border-bottom:1px solid var(--border);width:40%">' + line.substring(0, idx).trim() + '</td><td style="padding:8px 0 8px 12px;border-bottom:1px solid var(--border)">' + line.substring(idx+1).trim() + '</td></tr>';
    }
    return '<tr><td colspan="2" style="padding:8px 0;border-bottom:1px solid var(--border)">' + line.trim() + '</td></tr>';
  }).join('');
  document.getElementById('ficha-content').innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px;line-height:1.5">' + html + '</table>';
  document.getElementById('ficha-modal').style.display = 'flex';
}
function closeFicha(e){
  if(e && e.target !== document.getElementById('ficha-modal') && e.target.tagName !== 'BUTTON') return;
  document.getElementById('ficha-modal').style.display = 'none';
}

// ── START ─────────────────────────────────────────────────
init();
</script>

<div id="ficha-modal" onclick="closeFicha(event)" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)">
  <div id="ficha-modal-content" style="background:var(--bg);width:100%;max-width:550px;border-radius:12px;padding:24px;border-top:4px solid #3b82f6;box-shadow:0 10px 25px rgba(0,0,0,0.5);max-height:90vh;overflow-y:auto;position:relative">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px">
      <div style="font-weight:800;font-size:18px;color:var(--text-main)">⚙️ Especificaciones Técnicas</div>
      <button onclick="closeFicha()" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-main);cursor:pointer;line-height:1;transition:all 0.2s">×</button>
    </div>
    <div id="ficha-content" style="color:var(--text-secondary)"></div>
  </div>
</div>

</body>
